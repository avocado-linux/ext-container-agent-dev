name: Release

# Package + publish on a version tag. The matrix lives here (the caller owns it);
# each leg calls the single-combo reusable helper. The publish feed is derived from
# distro-release/distro-channel. The tag must equal the avocado.yaml version.
#
# The matrix dimension is the FEED, not the target. An extension version is
# global within a (distro-release, distro-channel), so two rows differing only by
# target publish the same version twice into the same feed and the second fails
# with "that extension version is already taken". Connect fans a published
# extension out to the per-target feeds itself - avocado-ext-cli and
# avocado-ext-microclaw are arch-specific and reach both qemux86-64-ext and
# imx93-frdm-ext while publishing only a qemux86-64 row - so `target` here just
# names the target used to package, and adding rows for other targets buys
# nothing while breaking the release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

jobs:
  publish:
    strategy:
      # Each feed reports its own outcome. Without this, one feed's failure
      # cancels the other and a partial publish looks like a total one.
      fail-fast: false
      matrix:
        include:
          - { target: qemux86-64, distro-release: "2026", distro-channel: next }
          - { target: qemux86-64, distro-release: "2024", distro-channel: next }
    uses: avocado-linux/actions/.github/workflows/extension-release.yml@v1
    with:
      target:         ${{ matrix.target }}
      distro-release: ${{ matrix.distro-release }}
      distro-channel: ${{ matrix.distro-channel }}
    secrets:
      connect-token: ${{ secrets.AVOCADO_CONNECT_TOKEN }}
      connect-org:   ${{ secrets.AVOCADO_CONNECT_ORG }}
